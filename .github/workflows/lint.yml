name: Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        cd functions
        npm ci

    - name: Run lint
      run: |
        cd functions
        npm run lint